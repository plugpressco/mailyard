<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('file:///Users/fahim/Workspace/plugpress/site/plugpress-theme/assets/fonts/bricolage-grotesque-600-800-latin.woff2') format('woff2');
    font-weight: 600 800;
  }
  @font-face {
    font-family: 'Space Mono';
    src: url('file:///Users/fahim/Workspace/plugpress/site/plugpress-theme/assets/fonts/space-mono-400-latin.woff2') format('woff2');
    font-weight: 400;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1544px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background: #050506;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .stage { position: absolute; inset: 0; }
  .words {
    position: absolute;
    left: 372px; top: 0; height: 500px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .name {
    font: 800 92px/1 'Bricolage Grotesque';
    letter-spacing: -0.03em;
    color: #ffffff;
  }
  .tag {
    margin-top: 24px;
    font: 400 31px/1 'Space Mono';
    color: #9a9aa4;
  }
</style>
</head>
<body>
  <svg class="stage" width="1544" height="500" viewBox="0 0 1544 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1e1e27"/>
        <stop offset="0.45" stop-color="#101015"/>
        <stop offset="1" stop-color="#050506"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.13" cy="0.18" r="0.55">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.055"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <!-- route lines fade in from nothing rather than starting on a hard edge -->
      <linearGradient id="fadeBlue" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2395E7" stop-opacity="0"/>
        <stop offset="0.28" stop-color="#2395E7" stop-opacity="0.85"/>
        <stop offset="0.72" stop-color="#2395E7" stop-opacity="1"/>
        <stop offset="1" stop-color="#2395E7" stop-opacity="0.25"/>
      </linearGradient>
      <linearGradient id="fadeWhite" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.85"/>
        <stop offset="0.72" stop-color="#ffffff" stop-opacity="1"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
      </linearGradient>
      <path id="mark" fill-rule="evenodd" clip-rule="evenodd" d="M180 0C279.411 1.64109e-06 360 80.5888 360 180C360 279.411 279.411 360 180 360C80.5888 360 1.56177e-06 279.411 0 180C0 80.5887 80.5887 0 180 0ZM52.1162 156.537C50.5682 157.079 49.5073 158.511 49.4404 160.149C49.3736 161.788 50.314 163.302 51.8125 163.968L151.656 208.343L196.032 308.188C196.698 309.686 198.212 310.626 199.851 310.56C201.489 310.493 202.921 309.432 203.463 307.884L282.203 82.9111C282.01 83.4511 281.698 83.9582 281.266 84.3906L157.516 208.141C155.954 209.703 153.421 209.703 151.859 208.141C150.297 206.579 150.297 204.046 151.859 202.484L275.609 78.7344C276.042 78.3021 276.548 77.9899 277.088 77.7969L52.1162 156.537Z"/>
    </defs>

    <rect width="1544" height="500" fill="url(#bg)"/>
    <rect width="1544" height="500" fill="url(#glow)"/>

    <!-- ghost mark bleeding off the right edge -->
    <use href="#mark" transform="translate(1030 20) scale(1.6)" fill="#ffffff" opacity="0.032"/>

    <!-- the failover story, abstracted: primary route + dotted fallback that rejoins -->
    <g fill="none" stroke-linecap="round">
      <path d="M120 420 C 430 446, 700 386, 1000 394 S 1330 390, 1544 362"
            stroke="url(#fadeBlue)" stroke-width="2" opacity="0.35"/>
      <path d="M540 411 C 690 468, 880 468, 1046 397"
            stroke="url(#fadeWhite)" stroke-width="1.5" opacity="0.12" stroke-dasharray="1 10"/>
      <circle cx="540" cy="411" r="3.5" fill="#2395E7" opacity="0.5"/>
      <circle cx="1046" cy="397" r="3.5" fill="#2395E7" opacity="0.5"/>
    </g>

    <!-- brand mark -->
    <use href="#mark" transform="translate(148 162) scale(0.48889)" fill="#f4f4f6"/>
  </svg>

  <div class="words">
    <div class="name">mailyard</div>
    <div class="tag">SMTP with a backup plan.</div>
  </div>
</body>
</html>
