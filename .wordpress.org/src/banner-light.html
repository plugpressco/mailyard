<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('file:///Users/fahim/Workspace/plugpress/site/plugpress-theme/assets/fonts/bricolage-grotesque-600-800-latin.woff2') format('woff2');
    font-weight: 600 800;
  }
  @font-face {
    font-family: 'Space Mono';
    src: url('file:///Users/fahim/Workspace/plugpress/site/plugpress-theme/assets/fonts/space-mono-400-latin.woff2') format('woff2');
    font-weight: 400;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1544px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background: #F5F8FB;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .stage { position: absolute; inset: 0; }
  .words {
    position: absolute;
    left: 140px; top: 0; height: 500px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .name {
    font: 800 92px/1 'Bricolage Grotesque';
    letter-spacing: -0.03em;
    color: #171717;
  }
  .tag {
    margin-top: 24px;
    font: 400 31px/1 'Space Mono';
    color: #5F6B76;
  }
</style>
</head>
<body>
  <svg class="stage" width="1544" height="500" viewBox="0 0 1544 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- delivery route: origin -> fork -> envelope; failover arc rejoins before delivery -->
    <circle cx="880" cy="250" r="8" fill="#2395E7"/>
    <path d="M888 250 H 1312" stroke="#2395E7" stroke-width="5" stroke-linecap="round"/>
    <path d="M1040 250 C 1094 250, 1098 330, 1160 330 C 1222 330, 1232 250, 1286 250"
          stroke="#94A3B0" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 14"/>
    <circle cx="1040" cy="250" r="9" fill="#F5F8FB" stroke="#2395E7" stroke-width="4"/>

    <!-- envelope -->
    <rect x="1318" y="203" width="130" height="94" rx="10" stroke="#171717" stroke-width="4"/>
    <path d="M1325 213 L 1383 260 L 1441 213" stroke="#171717" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="words">
    <div class="name">mailyard</div>
    <div class="tag">SMTP with a backup plan.</div>
  </div>
</body>
</html>
